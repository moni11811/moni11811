name: Profile README checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/profile-readme-test.js
      - run: node scripts/profile-history-test.js
      - run: node scripts/profile-repository-privacy-test.js
